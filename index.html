<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Início</title>
<style>
:root { --bg: #f5f7fa; --card: #ffffff; --ink: #202938; --muted: #697586; --line: #dde2ea; --blue: #315eaa; --green: #15966a; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 32px 16px;
}
h1 { font-size: 22px; margin: 0 auto 16px; max-width: 720px; }
.hub { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.tile {
  display: grid; gap: 8px; align-content: start; min-height: 160px; padding: 28px;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  color: var(--ink); text-decoration: none;
}
.tile strong { font-size: 20px; }
.tile span { color: var(--muted); font-size: 15px; }
.tile.planner { border-top: 6px solid var(--green); }
.tile.fin { border-top: 6px solid var(--blue); }
.tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>
<h1>Início</h1>
<nav class="hub">
  <a class="tile planner" href="planner/"><strong>Planner</strong><span>Agenda, tarefas, notas e tempo por atividade</span></a>
  <a class="tile fin" href="financas/"><strong>Finanças</strong><span>Contas a pagar e a receber</span></a>
</nav>
</body>
</html>
