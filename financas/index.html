<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<style>
:root {
  --bg: #f5f7fa; --card: #ffffff; --ink: #202938; --muted: #697586; --line: #dde2ea;
  --pos: #15966a; --neg: #dc4545; --blue: #315eaa; --amber: #e9aa35;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; cursor: pointer;
}
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 13px; }
button.danger { color: var(--neg); }
input, select {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.top h1 { font-size: 20px; margin: 0; font-weight: 800; flex: 1; min-width: 160px; }
.back { color: var(--blue); text-decoration: none; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.kpi strong { display: block; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 8px; }
.tabs button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1; }
.entry { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.entry:first-child { border-top: none; }
.entry-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.desc { font-weight: 700; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.amounts { text-align: right; font-variant-numeric: tabular-nums; display: grid; gap: 4px; justify-items: end; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef1f6; color: var(--muted); }
.badge.pendente { background: #fdf3dd; color: #8a5d00; }
.badge.parcial { background: #e6eefb; color: var(--blue); }
.badge.vencido { background: #fbe5e5; color: var(--neg); }
.badge.quitado { background: #dff3ea; color: var(--pos); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.pay-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.hist { display: grid; gap: 4px; font-size: 13px; color: var(--muted); padding-left: 4px; }
.hist div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form .full { grid-column: 1 / -1; }
.form .buttons { grid-column: 1 / -1; display: flex; gap: 8px; }
.empty { color: var(--muted); margin: 0; }
#status { color: var(--muted); font-size: 13px; margin: 0; min-height: 1em; }
#auth {
  max-width: 360px; margin: 12vh auto 0; display: grid; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
}
#auth h1 { margin: 0; font-size: 20px; }
</style>
</head>
<body>
<main>
  <section id="auth" hidden>
    <h1>Finanças</h1>
    <p class="meta">Digite seu e-mail. Você recebe um código de 8 dígitos. Use a mesma conta do Planner.</p>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <button id="send" class="primary" type="button">Enviar código</button>
    <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="Código de 8 dígitos" autocomplete="one-time-code" hidden>
    <button id="verify" class="primary" type="button" hidden>Entrar</button>
    <p id="auth-msg" class="meta" role="status"></p>
  </section>

  <section id="app" class="wrap" hidden>
    <header class="top">
      <a class="back" href="../">‹ Início</a>
      <h1>Contas a pagar e receber</h1>
      <input id="month" type="month" aria-label="Mês de vencimento" style="width:auto">
      <button id="logout" type="button">Sair</button>
    </header>
    <p id="status" role="status"></p>

    <div class="kpis">
      <div class="card kpi"><small>A pagar em aberto</small><strong id="k-pay-open">—</strong></div>
      <div class="card kpi"><small>Pago no mês</small><strong id="k-pay-done">—</strong></div>
      <div class="card kpi"><small>A receber em aberto</small><strong id="k-rec-open">—</strong></div>
      <div class="card kpi"><small>Resultado previsto</small><strong id="k-result">—</strong></div>
    </div>

    <div class="card" style="display:grid; gap:12px;">
      <div class="toolbar">
        <div class="tabs">
          <button id="tab-pagar" type="button" data-tab="pagar" aria-pressed="true">A pagar</button>
          <button id="tab-receber" type="button" data-tab="receber" aria-pressed="false">A receber</button>
        </div>
        <span class="grow"></span>
        <button id="new-btn" class="primary" type="button">+ Novo lançamento</button>
      </div>

      <form id="form" class="form" hidden>
        <label>Tipo
          <select id="f-kind">
            <option value="pagar">A pagar</option>
            <option value="receber">A receber</option>
          </select>
        </label>
        <label>Descrição
          <input id="f-desc" type="text" required>
        </label>
        <label>Credor / pagador
          <input id="f-who" type="text">
        </label>
        <label>Categoria
          <input id="f-cat" type="text" list="cats">
        </label>
        <label>Valor
          <input id="f-amount" type="text" inputmode="decimal" placeholder="0,00" required>
        </label>
        <label>Vencimento
          <input id="f-due" type="date" required>
        </label>
        <label class="full">Observações
          <input id="f-notes" type="text">
        </label>
        <div class="buttons">
          <button id="f-submit" class="primary" type="submit">Salvar</button>
          <button id="f-cancel" type="button">Cancelar</button>
        </div>
      </form>
      <datalist id="cats">
        <option value="Moradia"></option><option value="Alimentação"></option><option value="Açougue"></option>
        <option value="Transporte"></option><option value="Saúde"></option><option value="Educação"></option>
        <option value="Família"></option><option value="Comunicação"></option><option value="Lazer"></option>
        <option value="Assinaturas"></option><option value="Impostos"></option><option value="Dívidas"></option>
        <option value="Investimentos"></option><option value="Salário"></option><option value="Benefícios"></option>
        <option value="Renda extra"></option><option value="Prestação de serviços"></option><option value="Outras"></option>
      </datalist>

      <div id="list"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://llfthqksekwgxczihpdh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Fs2Rdx-h_kuMW-fUnZRj2g_d5It1BgM";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const LABEL = { pendente: "Pendente", parcial: "Parcial", vencido: "Vencido", quitado: "Quitado", cancelado: "Cancelado" };

  let tab = "pagar";                       // aba atual: pagar | receber
  let month = todayStr().slice(0, 7);      // mês de vencimento exibido (AAAA-MM)
  let entries = [];                        // lançamentos do usuário
  let payments = {};                       // { [entryId]: [pagamentos] }
  let payOpenId = null;                    // lançamento com formulário de pagamento aberto
  let editId = null;                       // lançamento em edição

  // ---------- utilidades ----------
  function todayStr() { return new Date().toLocaleDateString("en-CA"); }
  function brl(cents) {
    return (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  // Aceita "1.234,56", "1234,56" e "1234.56". Retorna centavos (NaN se inválido).
  function toCents(v) {
    let s = String(v).trim();
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function fmtDate(d) {
    const [y, m, day] = d.split("-");
    return day + "/" + m + "/" + y;
  }
  function setStatus(t) { $("status").textContent = t; }
  function btn(label, fn, cls) {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }
  // Botão de dois cliques para ações destrutivas
  function armedBtn(label, fn) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "danger";
    b.textContent = label;
    b.addEventListener("click", () => {
      if (!b.dataset.armed) {
        b.dataset.armed = "1";
        b.textContent = "Confirmar";
        setTimeout(() => { delete b.dataset.armed; b.textContent = label; }, 4000);
        return;
      }
      fn();
    });
    return b;
  }

  // Status derivado: o saldo em aberto vem dos pagamentos, não de um campo digitado
  function summarize(en) {
    const total = toCents(en.amount);
    const paid = (payments[en.id] || []).reduce((s, x) => s + toCents(x.amount), 0);
    const balance = total - paid;
    if (en.status === "cancelado") return { total, paid, balance: 0, st: "cancelado" };
    let st;
    if (balance <= 0) st = "quitado";
    else if (en.due_date < todayStr()) st = "vencido";
    else if (paid > 0) st = "parcial";
    else st = "pendente";
    return { total, paid, balance, st };
  }

  // ---------- dados ----------
  async function load() {
    setStatus("Carregando…");
    const [e, p] = await Promise.all([
      sb.from("fin_entries").select("*").order("due_date", { ascending: true }),
      sb.from("fin_payments").select("*").order("paid_on", { ascending: true })
    ]);
    if (e.error || p.error) {
      setStatus("Não foi possível carregar. Confira se as tabelas financeiras foram criadas.");
      return;
    }
    entries = e.data || [];
    payments = {};
    (p.data || []).forEach((x) => { (payments[x.entry_id] = payments[x.entry_id] || []).push(x); });
    setStatus("Sincronizado");
    render();
  }

  // ---------- tela ----------
  function render() {
    $("tab-pagar").setAttribute("aria-pressed", String(tab === "pagar"));
    $("tab-receber").setAttribute("aria-pressed", String(tab === "receber"));
    $("month").value = month;

    const inMonth = entries.filter((en) => en.due_date.slice(0, 7) === month);
    let payOpen = 0, recOpen = 0, payDone = 0;
    inMonth.forEach((en) => {
      if (en.status === "cancelado") return;
      const s = summarize(en);
      if (en.kind === "pagar") payOpen += s.balance; else recOpen += s.balance;
    });
    entries.forEach((en) => {
      if (en.kind !== "pagar") return;
      (payments[en.id] || []).forEach((x) => {
        if (x.paid_on.slice(0, 7) === month) payDone += toCents(x.amount);
      });
    });
    $("k-pay-open").textContent = brl(payOpen);
    $("k-pay-done").textContent = brl(payDone);
    $("k-rec-open").textContent = brl(recOpen);
    const result = recOpen - payOpen;
    $("k-result").textContent = brl(result);
    $("k-result").style.color = result < 0 ? "var(--neg)" : "var(--pos)";

    const list = inMonth
      .filter((en) => en.kind === tab)
      .sort((a, b) => a.due_date.localeCompare(b.due_date));
    const box = $("list");
    box.textContent = "";
    if (!list.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = tab === "pagar" ? "Nenhuma conta a pagar neste mês." : "Nenhuma conta a receber neste mês.";
      box.append(p);
      return;
    }
    list.forEach((en) => box.append(entryEl(en)));
  }

  function entryEl(en) {
    const s = summarize(en);
    const row = document.createElement("div");
    row.className = "entry";

    const head = document.createElement("div");
    head.className = "entry-head";
    const left = document.createElement("div");
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = en.description;
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = [en.counterparty, en.category, "vence " + fmtDate(en.due_date)].filter(Boolean).join(" · ");
    left.append(d, m);

    const right = document.createElement("div");
    right.className = "amounts";
    const badge = document.createElement("span");
    badge.className = "badge " + s.st;
    badge.textContent = LABEL[s.st];
    const total = document.createElement("div");
    total.textContent = brl(s.total);
    right.append(badge, total);
    if (s.st !== "quitado" && s.st !== "cancelado") {
      const bal = document.createElement("div");
      bal.className = "meta";
      bal.textContent = "saldo " + brl(s.balance);
      right.append(bal);
    }
    head.append(left, right);
    row.append(head);

    if (en.notes) {
      const n = document.createElement("div");
      n.className = "meta";
      n.textContent = en.notes;
      row.append(n);
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    if (s.st !== "cancelado" && s.balance > 0) {
      actions.append(btn(
        tab === "pagar" ? "Registrar pagamento" : "Registrar recebimento",
        () => { payOpenId = payOpenId === en.id ? null : en.id; render(); },
        "primary"
      ));
    }
    actions.append(btn("Editar", () => startEdit(en)));
    if (s.st !== "cancelado") actions.append(armedBtn("Cancelar lançamento", () => cancelEntry(en)));
    row.append(actions);

    if (payOpenId === en.id) row.append(payForm(en, s));

    const hist = payments[en.id] || [];
    if (hist.length) {
      const h = document.createElement("div");
      h.className = "hist";
      hist.forEach((x) => {
        const line = document.createElement("div");
        const txt = document.createElement("span");
        txt.textContent = fmtDate(x.paid_on) + " · " + brl(toCents(x.amount));
        line.append(txt, armedBtn("Excluir", () => deletePayment(x)));
        h.append(line);
      });
      row.append(h);
    }
    return row;
  }

  function payForm(en, s) {
    const f = document.createElement("div");
    f.className = "pay-form";
    const amt = document.createElement("input");
    amt.type = "text";
    amt.inputMode = "decimal";
    amt.value = (s.balance / 100).toFixed(2).replace(".", ",");
    amt.setAttribute("aria-label", "Valor do pagamento");
    const dt = document.createElement("input");
    dt.type = "date";
    dt.value = todayStr();
    dt.setAttribute("aria-label", "Data do pagamento");
    const ok = btn("Confirmar", () => registerPayment(en, s, amt.value, dt.value), "primary");
    f.append(amt, dt, ok);
    return f;
  }

  // ---------- ações ----------
  async function registerPayment(en, s, value, paidOn) {
    const c = toCents(value);
    if (!(c > 0)) { setStatus("Informe um valor maior que zero"); return; }
    if (c > s.balance) { setStatus("O valor é maior que o saldo em aberto"); return; }
    if (!paidOn) { setStatus("Informe a data"); return; }
    const { error } = await sb.from("fin_payments").insert({
      entry_id: en.id, amount: (c / 100).toFixed(2), paid_on: paidOn
    });
    if (error) { setStatus("Não foi possível registrar: " + error.message); return; }
    payOpenId = null;
    await load();
    setStatus("Pagamento registrado");
  }

  async function deletePayment(x) {
    const { error } = await sb.from("fin_payments").delete().eq("id", x.id);
    if (error) { setStatus("Não foi possível excluir o pagamento"); return; }
    await load();
    setStatus("Pagamento excluído");
  }

  async function cancelEntry(en) {
    const { error } = await sb.from("fin_entries")
      .update({ status: "cancelado", updated_at: new Date().toISOString() })
      .eq("id", en.id);
    if (error) { setStatus("Não foi possível cancelar"); return; }
    await load();
    setStatus("Lançamento cancelado");
  }

  function openForm() {
    $("form").hidden = false;
    $("f-submit").textContent = editId ? "Salvar alterações" : "Salvar";
    $("f-desc").focus();
  }
  function closeForm() {
    editId = null;
    $("form").reset();
    $("form").hidden = true;
  }
  function newEntry() {
    closeForm();
    $("f-kind").value = tab;
    $("f-due").value = todayStr();
    openForm();
  }
  function startEdit(en) {
    closeForm();
    editId = en.id;
    $("f-kind").value = en.kind;
    $("f-desc").value = en.description;
    $("f-who").value = en.counterparty || "";
    $("f-cat").value = en.category || "";
    $("f-amount").value = (toCents(en.amount) / 100).toFixed(2).replace(".", ",");
    $("f-due").value = en.due_date;
    $("f-notes").value = en.notes || "";
    openForm();
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const c = toCents($("f-amount").value);
    if (!(c > 0)) { setStatus("Informe um valor maior que zero"); return; }
    const row = {
      kind: $("f-kind").value,
      description: $("f-desc").value.trim(),
      counterparty: $("f-who").value.trim() || null,
      category: $("f-cat").value.trim() || null,
      amount: (c / 100).toFixed(2),
      due_date: $("f-due").value,
      notes: $("f-notes").value.trim() || null
    };
    if (!row.description || !row.due_date) { setStatus("Preencha descrição e vencimento"); return; }
    let res;
    if (editId) {
      res = await sb.from("fin_entries").update(Object.assign({ updated_at: new Date().toISOString() }, row)).eq("id", editId);
    } else {
      const { data: u } = await sb.auth.getUser();
      res = await sb.from("fin_entries").insert(Object.assign({ user_id: u.user.id }, row));
    }
    if (res.error) { setStatus("Não foi possível salvar: " + res.error.message); return; }
    // Leva a tela ao mês e à aba do lançamento salvo, para ele não sumir da lista
    month = row.due_date.slice(0, 7);
    tab = row.kind;
    closeForm();
    await load();
    setStatus("Lançamento salvo");
  });
  $("f-cancel").addEventListener("click", closeForm);
  $("new-btn").addEventListener("click", newEntry);
  document.querySelectorAll("[data-tab]").forEach((b) => {
    b.addEventListener("click", () => { tab = b.dataset.tab; payOpenId = null; render(); });
  });
  $("month").addEventListener("change", () => {
    month = $("month").value || todayStr().slice(0, 7);
    payOpenId = null;
    render();
  });

  // ---------- login (mesmo fluxo do Planner) ----------
  const emailEl = $("email"), codeEl = $("code"), authMsg = $("auth-msg");
  emailEl.value = localStorage.getItem("planner-email") || "";

  $("send").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    if (!email) { authMsg.textContent = "Digite seu e-mail."; return; }
    authMsg.textContent = "Enviando código…";
    const { error } = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
    if (error) { authMsg.textContent = "Não foi possível enviar: " + error.message; return; }
    localStorage.setItem("planner-email", email);
    codeEl.hidden = false;
    $("verify").hidden = false;
    authMsg.textContent = "Confira seu e-mail e digite o código.";
    codeEl.focus();
  });
  $("verify").addEventListener("click", async () => {
    const token = codeEl.value.trim();
    if (!token) { authMsg.textContent = "Digite o código."; return; }
    const { error } = await sb.auth.verifyOtp({ email: emailEl.value.trim(), token: token, type: "email" });
    if (error) authMsg.textContent = "Código inválido ou expirado.";
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); });

  function showApp(on) {
    $("auth").hidden = on;
    $("app").hidden = !on;
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (session) { showApp(true); load(); } else { showApp(false); }
  });
  sb.auth.getSession().then(({ data }) => { if (!data.session) showApp(false); });
})();
</script>
</body>
</html>
