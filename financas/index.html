<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<style>
:root {
  --bg: #f5f7fa; --card: #ffffff; --ink: #202938; --muted: #697586; --line: #dde2ea;
  --pos: #15966a; --neg: #dc4545; --blue: #315eaa; --amber: #e9aa35;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; cursor: pointer;
}
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 13px; }
button.danger { color: var(--neg); }
button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
input, select {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.top h1 { font-size: 20px; margin: 0; font-weight: 800; flex: 1; min-width: 160px; }
.back { color: var(--blue); text-decoration: none; font-weight: 700; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.kpi strong { display: block; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1; }
.item { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.item:first-child { border-top: none; }
.item-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.desc { font-weight: 700; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.amounts { text-align: right; font-variant-numeric: tabular-nums; display: grid; gap: 4px; justify-items: end; }
.amount-in { color: var(--pos); font-weight: 700; }
.amount-out { color: var(--neg); font-weight: 700; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef1f6; color: var(--muted); }
.badge.pendente { background: #fdf3dd; color: #8a5d00; }
.badge.parcial { background: #e6eefb; color: var(--blue); }
.badge.vencido { background: #fbe5e5; color: var(--neg); }
.badge.quitado { background: #dff3ea; color: var(--pos); }
.badge.caixa { background: #eef1f6; color: var(--ink); }
.badge.baixa { background: #e6eefb; color: var(--blue); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.inline-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.hist { display: grid; gap: 4px; font-size: 13px; color: var(--muted); padding-left: 4px; }
.hist div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form .full { grid-column: 1 / -1; }
.form .buttons { grid-column: 1 / -1; display: flex; gap: 8px; }
.empty { color: var(--muted); margin: 0; }
.totals { display: flex; flex-wrap: wrap; gap: 16px; font-variant-numeric: tabular-nums; }
.totals span { color: var(--muted); font-size: 13px; }
.totals strong { display: block; font-size: 18px; color: var(--ink); }
#status { color: var(--muted); font-size: 13px; margin: 0; min-height: 1em; }
#auth {
  max-width: 360px; margin: 12vh auto 0; display: grid; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
}
#auth h1 { margin: 0; font-size: 20px; }
.scroll { overflow-x: auto; }
.sheet { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 560px; margin-bottom: 18px; }
.sheet th, .sheet td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.sheet th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sheet .num { text-align: right; }
.sheet input { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; width: 100%; min-width: 0; }
.sheet .num input { text-align: right; }
.sheet input:focus { background: var(--card); border-color: var(--blue); }
.sheet tr.sub td { font-weight: 700; background: #f3f6fb; }
.sheet tr.bold td { font-weight: 800; }
.sheet tr.add-row td { background: #fafbfd; }
.sheet tr.add-row input { border-color: var(--line); background: var(--card); }
.sheet .neg { color: var(--neg); }
.sheet tr.muted-row td { color: var(--muted); }

/* ===== Novo visual: menu lateral escuro, cards com faixa colorida, fundo claro ===== */
:root {
  --blue: #3f51c9; --bg: #f3f5fb; --line: #e3e8f2; --ink: #1c2540; --muted: #6b7690;
}
body {
  background:
    radial-gradient(900px 480px at 88% -10%, #e6dcff 0%, transparent 60%),
    radial-gradient(700px 420px at 15% 110%, #dde9ff 0%, transparent 60%),
    #f3f5fb;
  min-height: 100vh; padding: 0;
}
#app { margin-left: 240px; padding: 22px 26px 40px; max-width: none; }
.top {
  background: #fff; border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 16px; box-shadow: 0 1px 2px rgba(20,30,70,.04);
}
.top h1 { font-size: 22px; letter-spacing: -.01em; }
.card {
  border-radius: 16px; border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(30,40,90,.05);
}
button { border-radius: 10px; }
button.primary { box-shadow: 0 4px 12px rgba(63,81,201,.25); }
input, select { border-radius: 10px; }

/* Menu lateral */
.nav {
  position: fixed; top: 0; left: 0; bottom: 0; width: 240px;
  flex-direction: column; flex-wrap: nowrap; gap: 4px; padding: 22px 14px;
  background: linear-gradient(180deg, #121b35 0%, #0d1530 100%);
  overflow-y: auto; z-index: 10;
}
.nav::before {
  content: "Finanças"; display: block; color: #fff; font-weight: 800; font-size: 20px;
  padding: 6px 10px 18px;
}
.nav button {
  position: relative; width: 100%; text-align: left; background: transparent; border: none;
  color: #aab4cc; padding: 11px 12px; border-radius: 10px; font-weight: 600;
}
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button[aria-pressed="true"] { background: #1f2c52; color: #fff; font-weight: 700; }
.nav button[aria-pressed="true"]::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
  border-radius: 50%; background: #a78bfa;
}

/* Cards de indicadores com faixa colorida no topo */
.kpis > * { position: relative; overflow: hidden; }
.kpis > *::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c, #4f6ef7);
}
.kpis > *:nth-child(6n+1) { --c: #4f6ef7; }
.kpis > *:nth-child(6n+2) { --c: #22a06b; }
.kpis > *:nth-child(6n+3) { --c: #8b5cf6; }
.kpis > *:nth-child(6n+4) { --c: #14b8a6; }
.kpis > *:nth-child(6n+5) { --c: #f59e0b; }
.kpis > *:nth-child(6n+6) { --c: #ef4444; }
.kpi small { font-size: 11px; color: #5b6680; }
.kpi strong { font-size: 24px; font-weight: 800; }

/* Tabelas */
.sheet th { background: #f7f8fc; }
.sheet tr.sub td { background: #eef2fb; }
.sheet tr.add-row td { background: #fafbfd; }

@media (max-width: 900px) {
  #app { margin-left: 0; padding: 14px 14px 30px; }
  .nav {
    position: static; width: auto; flex-direction: row; overflow-x: auto; padding: 8px;
    border-radius: 14px; background: #0d1530;
  }
  .nav::before { display: none; }
  .nav button { width: auto; white-space: nowrap; }
}

/* Esconder/mostrar o menu lateral (preferência guardada no aparelho) */
#menu-toggle { min-height: 40px; white-space: nowrap; }
body.menu-hidden .panel-menu, body.menu-hidden .nav { display: none !important; }
body.menu-hidden #app { margin-left: 0 !important; }

/* =====================================================================
   FINANCEIRO com o mesmo layout do Planner (tema escuro em vidro + menu superior)
   ===================================================================== */
:root, :root:root {
  color-scheme: dark;
  --bg: #0b1230; --card: rgba(255,255,255,.07); --ink: #eef3ff; --muted: #9aa6c4; --line: rgba(255,255,255,.12);
  --blue: #2f8dff; --pos: #34d399; --neg: #fb7185; --amber: #fbbf24;
}
html { background: #0b1230; }
body {
  color: var(--ink); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(860px 560px at 88% 112%, rgba(255,164,64,.55) 0%, rgba(255,120,60,.18) 38%, transparent 66%),
    radial-gradient(760px 520px at -6% -10%, rgba(38,96,220,.45) 0%, transparent 62%),
    radial-gradient(640px 420px at 60% 40%, rgba(90,70,200,.22) 0%, transparent 70%),
    linear-gradient(180deg, #0a1030 0%, #131a3a 58%, #2b2544 100%);
  background-attachment: fixed;
}
#app { margin-left: 0 !important; max-width: 1280px; display: flex; flex-direction: column; gap: 14px; }
#app > .top { order: 1; }
#app > .panel-menu { order: 0; }
.top, .card {
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.14); border-radius: 20px;
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 22px 46px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.10);
}
.top h1 { color: var(--ink); }
.top a.back { color: #8fd0ff; font-weight: 700; text-decoration: none; }
.top a.back:hover { background: rgba(47,155,255,.14); }

/* Menu superior: barra de botões */
.nav.panel-menu, .panel-menu {
  position: relative; top: auto; left: auto; bottom: auto; z-index: 5; width: auto; height: auto;
  margin: 0; padding: 8px; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
  overflow: visible; border-radius: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 22px 46px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.10);
}
.panel-menu::before {
  content: "Finanças"; display: inline-flex; align-items: center; padding: 0 12px 0 10px; margin-right: 4px;
  font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.01em; align-self: center;
}
.panel-menu button, .panel-menu a.menu-link {
  display: inline-flex; align-items: center; gap: 8px; width: auto; flex: 0 0 auto; min-height: 40px; padding: 8px 16px; margin: 0;
  border-radius: 14px; font-size: 14px; font-weight: 700; white-space: nowrap; text-align: center; text-decoration: none;
  background: rgba(255,255,255,.07); color: #c3cde3; border: 1px solid rgba(255,255,255,.10); box-shadow: none;
}
.panel-menu button:hover, .panel-menu a.menu-link:hover { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.2); }
.panel-menu button[aria-pressed="true"] {
  background: linear-gradient(135deg, #2f8dff 0%, #22c3f5 100%); color: #fff; border-color: transparent;
  box-shadow: 0 10px 24px rgba(47,155,255,.32), inset 0 1px 0 rgba(255,255,255,.25);
}
.panel-menu button[aria-pressed="true"]::after { display: none; }
.panel-menu .ico { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 599px) {
  .panel-menu.panel-menu { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  .panel-menu.panel-menu::-webkit-scrollbar { display: none; }
  .panel-menu::before { display: none; }
  .panel-menu button, .panel-menu a.menu-link { font-size: 13px; padding: 8px 14px; min-height: 38px; }
}
body.menu-hidden .panel-menu { display: none !important; }

/* Botões, campos e tabelas */
button {
  background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
button:hover { background: rgba(255,255,255,.14); }
button.primary, button[aria-pressed="true"]:not(.panel-menu button) {
  background: linear-gradient(135deg, #2f8dff 0%, #22c3f5 100%); border-color: transparent; color: #fff;
  box-shadow: 0 10px 26px rgba(47,155,255,.36), inset 0 1px 0 rgba(255,255,255,.25);
}
button.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
button.ghost:hover { background: rgba(47,155,255,.14); color: #8fd0ff; }
button.danger { color: #fda4af; }
input, select, textarea {
  background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid rgba(255,255,255,.14);
}
input::placeholder, textarea::placeholder { color: #6f7b99; }
input:focus, select:focus, textarea:focus { border-color: #2f9bff; outline: 3px solid rgba(47,155,255,.30); outline-offset: 1px; }
select option { background: #141a3a; color: var(--ink); }
label { color: var(--muted); }
.kpi small { color: var(--muted); }
.kpi strong { color: #fff; }
.sheet th { background: rgba(255,255,255,.06); color: var(--muted); }
.sheet tr.sub td { background: rgba(255,255,255,.04); }
.sheet tr.add-row td { background: rgba(255,255,255,.03); }
table, th, td { border-color: rgba(255,255,255,.10); color: var(--ink); }
tr:hover td { background: rgba(255,255,255,.04); }
.nav:not(.panel-menu) button { background: rgba(255,255,255,.07); }
.nav:not(.panel-menu) button[aria-pressed="true"] { background: linear-gradient(135deg, #2f8dff 0%, #22c3f5 100%); color: #fff; }
dialog, .modal, .modal-box { background: linear-gradient(180deg, rgba(28,36,72,.97), rgba(18,24,52,.97)); color: var(--ink); }
.nav:not(.panel-menu) { position: static; width: auto; height: auto; flex-direction: row; flex-wrap: wrap; overflow: visible; padding: 0; background: none; gap: 8px; }
.nav:not(.panel-menu)::before { display: none; }
#app > *:not(.top):not(.panel-menu) { order: 2; }
#app > * { width: 100%; }
.wrap { max-width: none !important; margin-left: 0 !important; margin-right: 0 !important; }
.nav:not(.panel-menu) button[aria-pressed="true"]::after { display: none !important; }

/* =====================================================================
   MENU EM CORTINA (iPhone): um botão abre os itens descendo do topo
   ===================================================================== */
.curtain-btn { display: none; }
@media (max-width: 599px), html[data-device="iphone"] {
  .panel-menu, .panel-menu.panel-menu { flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; overflow: visible; }
  .panel-menu::before { display: inline-flex !important; font-size: 17px; padding: 0 4px; margin: 0; }
  .curtain-btn {
    display: inline-flex; align-items: center; gap: 8px; margin-left: auto; min-height: 42px; padding: 8px 16px;
    border-radius: 14px; font-size: 15px; font-weight: 800;
    background: linear-gradient(135deg, #2f8dff 0%, #22c3f5 100%); color: #fff; border: none;
    box-shadow: 0 10px 24px rgba(47,155,255,.32);
  }
  .curtain-btn[aria-expanded="true"] { background: rgba(255,255,255,.14); box-shadow: none; border: 1px solid rgba(255,255,255,.18); }
  .panel-menu:not(.open) > button:not(.curtain-btn), .panel-menu:not(.open) > a.menu-link { display: none !important; }
  .panel-menu.open > button:not(.curtain-btn), .panel-menu.open > a.menu-link {
    display: inline-flex !important; flex: 0 0 calc(50% - 4px); width: calc(50% - 4px); justify-content: flex-start;
    min-height: 46px; font-size: 15px; animation: curtainIn .26s ease both;
  }
  .panel-menu.open > button:nth-of-type(n) { }
  .panel-menu.open { padding-bottom: 12px; }
  .panel-menu.open > .curtain-btn { flex: 0 0 auto; }
}
@keyframes curtainIn { from { opacity: 0; transform: translateY(-10px) scale(.98); } to { opacity: 1; transform: none; } }
</style>
<script>
(function () {
  var ua = navigator.userAgent || "", touch = navigator.maxTouchPoints || 0, k = "other";
  if (/iPhone|iPod/.test(ua)) k = "iphone";
  else if (/iPad/.test(ua) || (/Macintosh/.test(ua) && touch > 1)) k = "ipad";
  else if (/Android/.test(ua)) k = /Mobile/.test(ua) ? "android-phone" : "android-tablet";
  else if (/Macintosh/.test(ua)) k = "mac";
  else if (/Windows/.test(ua)) k = "windows";
  document.documentElement.setAttribute("data-device", k);
})();
</script>
</head>
<body>
<main>
  <section id="auth" hidden>
    <h1>Finanças</h1>
    <p class="meta">Digite seu e-mail. Você recebe um código de 8 dígitos. Use a mesma conta do Planner.</p>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="email">
    <button id="send" class="primary" type="button">Enviar código</button>
    <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="Código de 8 dígitos" autocomplete="one-time-code" hidden>
    <button id="verify" class="primary" type="button" hidden>Entrar</button>
    <p id="auth-msg" class="meta" role="status"></p>
  </section>

  <section id="app" class="wrap" hidden>
    <header class="top">
      <a class="back" href="../">‹ Início</a>
      <button id="menu-toggle" type="button" aria-expanded="true" aria-controls="app">☰ Esconder menu</button>
      <h1>Finanças</h1>
      <input id="month" type="month" aria-label="Mês" style="width:auto">
      <button id="logout" type="button">Sair</button>
    </header>

    <nav class="nav panel-menu" id="main-menu" aria-label="Telas">
      <button type="button" class="curtain-btn" aria-expanded="false" aria-controls="main-menu">☰ Menu</button>
      <a class="menu-link" href="../planner/"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Planner</span></a>
      <button type="button" data-view="contas" aria-pressed="true">Contas a pagar e receber</button>
      <button type="button" data-view="caixa" aria-pressed="false">Caixa</button>
      <button type="button" data-view="fluxo" aria-pressed="false">Fluxo de caixa</button>
      <button type="button" data-view="mensal" aria-pressed="false">Planilha do mês</button>
      <button type="button" data-view="mov" aria-pressed="false">Movimentações</button>
    </nav>
    <p id="status" role="status"></p>

    <!-- CONTAS A PAGAR E RECEBER -->
    <div id="v-contas" class="wrap">
      <div class="kpis">
        <div class="card kpi"><small>A pagar em aberto</small><strong id="k-pay-open">—</strong></div>
        <div class="card kpi"><small>Pago no mês</small><strong id="k-pay-done">—</strong></div>
        <div class="card kpi"><small>A receber em aberto</small><strong id="k-rec-open">—</strong></div>
        <div class="card kpi"><small>Resultado previsto</small><strong id="k-result">—</strong></div>
      </div>
      <div class="card" style="display:grid; gap:12px;">
        <div class="toolbar">
          <div class="nav">
            <button id="tab-pagar" type="button" data-tab="pagar" aria-pressed="true">A pagar</button>
            <button id="tab-receber" type="button" data-tab="receber" aria-pressed="false">A receber</button>
          </div>
          <span class="grow"></span>
          <button id="new-btn" class="primary" type="button">+ Novo lançamento</button>
        </div>

        <form id="form" class="form" hidden>
          <label>Tipo
            <select id="f-kind">
              <option value="pagar">A pagar</option>
              <option value="receber">A receber</option>
            </select>
          </label>
          <label>Descrição
            <input id="f-desc" type="text" required>
          </label>
          <label>Credor / pagador
            <input id="f-who" type="text">
          </label>
          <label>Categoria
            <select id="f-cat"></select>
            <input id="f-cat-new" type="text" placeholder="Nome da nova categoria" hidden>
          </label>
          <label>Valor total
            <input id="f-amount" type="text" inputmode="decimal" placeholder="0,00" required>
          </label>
          <label>Vencimento (1ª parcela)
            <input id="f-due" type="date" required>
          </label>
          <label id="f-rec-wrap">Repetição
            <select id="f-rec">
              <option value="none">Não repete</option>
              <option value="monthly">Mensal (sem desdobrar)</option>
            </select>
          </label>
          <label id="f-rec-end-wrap" hidden>Repetir até (opcional)
            <input id="f-rec-end" type="date">
          </label>
          <label id="f-n-wrap">Parcelas
            <input id="f-n" type="number" min="1" max="360" value="1">
          </label>
          <label class="full">Observações
            <input id="f-notes" type="text">
          </label>
          <div class="buttons">
            <button id="f-submit" class="primary" type="submit">Salvar</button>
            <button id="f-cancel" type="button">Cancelar</button>
          </div>
        </form>

        <div id="list"></div>
        <div id="rec-list"></div>
      </div>
    </div>

    <!-- CAIXA -->
    <div id="v-caixa" class="wrap" hidden>
      <div class="card" style="display:grid; gap:12px;">
        <h2 style="margin:0; font-size:16px;" id="cx-title">Novo lançamento de caixa</h2>
        <form id="cx-form" class="form">
          <label>Tipo
            <select id="cx-tipo">
              <option value="saida">Despesa (saída)</option>
              <option value="entrada">Crédito recebido (entrada)</option>
            </select>
          </label>
          <label>Descrição
            <input id="cx-desc" type="text" required>
          </label>
          <label>Quem paga / recebe
            <input id="cx-who" type="text">
          </label>
          <label>Categoria
            <select id="cx-cat"></select>
            <input id="cx-cat-new" type="text" placeholder="Nome da nova categoria" hidden>
          </label>
          <label>Valor
            <input id="cx-amount" type="text" inputmode="decimal" placeholder="0,00" required>
          </label>
          <label>Data
            <input id="cx-date" type="date" required>
          </label>
          <label class="full">Observações
            <input id="cx-notes" type="text">
          </label>
          <div class="buttons">
            <button id="cx-submit" class="primary" type="submit">Lançar</button>
            <button id="cx-cancel" type="button" hidden>Cancelar edição</button>
          </div>
        </form>
      </div>

      <div class="card" style="display:grid; gap:12px;">
        <div class="totals" id="cx-totals"></div>
        <div id="cx-list"></div>
      </div>
    </div>

    <!-- FLUXO DE CAIXA: previsto x realizado por dia -->
    <div id="v-fluxo" class="wrap" hidden>
      <div class="card" style="display:grid; gap:12px;">
        <div class="toolbar">
          <span class="meta">Saldo inicial do mês</span>
          <input id="fx-open" type="text" inputmode="decimal" placeholder="0,00" style="width:160px" aria-label="Saldo inicial do mês">
        </div>
        <div class="totals" id="fx-totals"></div>
        <div class="scroll" id="fx-sheet"></div>
      </div>
    </div>

    <!-- PLANILHA DO MÊS (formato da aba Junho) -->
    <div id="v-mensal" class="wrap" hidden>
      <div class="card scroll" id="sheet"></div>
    </div>

    <!-- MOVIMENTAÇÕES -->
    <div id="v-mov" class="wrap" hidden>
      <div class="card" style="display:grid; gap:12px;">
        <div class="toolbar">
          <div class="nav">
            <button type="button" data-mov="todas" aria-pressed="true">Todas</button>
            <button type="button" data-mov="entrada" aria-pressed="false">Entradas</button>
            <button type="button" data-mov="saida" aria-pressed="false">Saídas</button>
          </div>
          <span class="grow"></span>
          <div class="nav">
            <button type="button" data-origem="todas" aria-pressed="true">Tudo</button>
            <button type="button" data-origem="caixa" aria-pressed="false">Só caixa</button>
            <button type="button" data-origem="baixa" aria-pressed="false">Só contas baixadas</button>
          </div>
        </div>
        <div class="totals" id="mov-totals"></div>
        <div id="mov-list"></div>
      </div>
    </div>
  </section>
</main>

<datalist id="cats">
  <option value="Moradia"></option><option value="Alimentação"></option><option value="Açougue"></option>
  <option value="Transporte"></option><option value="Saúde"></option><option value="Educação"></option>
  <option value="Família"></option><option value="Comunicação"></option><option value="Lazer"></option>
  <option value="Assinaturas"></option><option value="Impostos"></option><option value="Dívidas"></option>
  <option value="Investimentos"></option><option value="Salário"></option><option value="Benefícios"></option>
  <option value="Renda extra"></option><option value="Prestação de serviços"></option><option value="Outras"></option>
</datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://llfthqksekwgxczihpdh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Fs2Rdx-h_kuMW-fUnZRj2g_d5It1BgM";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const LABEL = { pendente: "Pendente", parcial: "Parcial", vencido: "Vencido", quitado: "Quitado", cancelado: "Cancelado" };

  let view = "contas";                     // contas | caixa | mov
  let tab = "pagar";                       // contas: pagar | receber
  let movTipo = "todas", movOrigem = "todas";
  let month = todayStr().slice(0, 7);      // mês exibido (AAAA-MM)
  let realEntries = [], recurrences = [];  // lançamentos gravados e regras de recorrência
  let entries = [], payments = {};         // exibidos: gravados + ocorrências virtuais do mês
  let editEn = null;                       // lançamento em edição (pode ser virtual)
  let movements = [];                      // lançamentos de caixa
  let ledger = [];
  let openings = {};                       // saldo inicial por mês: { "AAAA-MM": centavos }
  let categories = [];                     // nomes das categorias do usuário
  let payOpenId = null, editId = null, cxEditId = null;

  // ---------- utilidades ----------
  function todayStr() { return new Date().toLocaleDateString("en-CA"); }
  function brl(cents) {
    return (cents / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  // Aceita "1.234,56", "1234,56" e "1234.56". Retorna centavos (NaN se inválido).
  function toCents(v) {
    let s = String(v).trim();
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : NaN;
  }
  function fmtDate(d) {
    const [y, m, day] = d.split("-");
    return day + "/" + m + "/" + y;
  }
  function setStatus(t) { $("status").textContent = t; }
  function btn(label, fn, cls) {
    const b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }
  // Botão de dois cliques para ações destrutivas
  function armedBtn(label, fn) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "danger";
    b.textContent = label;
    b.addEventListener("click", () => {
      if (!b.dataset.armed) {
        b.dataset.armed = "1";
        b.textContent = "Confirmar";
        setTimeout(() => { delete b.dataset.armed; b.textContent = label; }, 4000);
        return;
      }
      fn();
    });
    return b;
  }
  function item(parts) {
    const row = document.createElement("div");
    row.className = "item";
    const head = document.createElement("div");
    head.className = "item-head";
    const left = document.createElement("div");
    const d = document.createElement("div");
    d.className = "desc";
    d.textContent = parts.title;
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = parts.meta;
    left.append(d, m);
    const right = document.createElement("div");
    right.className = "amounts";
    if (parts.badge) {
      const b = document.createElement("span");
      b.className = "badge " + parts.badgeClass;
      b.textContent = parts.badge;
      right.append(b);
    }
    const v = document.createElement("div");
    v.className = parts.amountClass || "";
    v.textContent = parts.amount;
    right.append(v);
    head.append(left, right);
    row.append(head);
    if (parts.actions && parts.actions.length) {
      const acts = document.createElement("div");
      acts.className = "actions";
      parts.actions.forEach((a) => acts.append(a));
      row.append(acts);
    }
    return row;
  }

  // Status derivado: o saldo em aberto vem dos pagamentos, não de um campo digitado
  function summarize(en) {
    const total = toCents(en.amount);
    const paid = (payments[en.id] || []).reduce((s, x) => s + toCents(x.amount), 0);
    const balance = total - paid;
    if (en.status === "cancelado") return { total, paid, balance: 0, st: "cancelado" };
    let st;
    if (balance <= 0) st = "quitado";
    else if (en.due_date < todayStr()) st = "vencido";
    else if (paid > 0) st = "parcial";
    else st = "pendente";
    return { total, paid, balance, st };
  }

  // ---------- dados ----------
  // Cada tabela é lida à parte: se uma falhar, as demais continuam aparecendo.
  async function load() {
    setStatus("Carregando…");
    const failed = [];
    const take = (name, res) => {
      if (res.error) { failed.push(name + ": " + res.error.message); return []; }
      return res.data || [];
    };
    try {
      await loadCats();
      const [e, p, m, l, r, o] = await Promise.all([
        sb.from("fin_entries").select("*").order("due_date", { ascending: true }),
        sb.from("fin_payments").select("*").order("paid_on", { ascending: true }),
        sb.from("fin_movements").select("*").order("data", { ascending: true }),
        sb.from("fin_ledger").select("*").order("data", { ascending: true }),
        sb.from("fin_recurrences").select("*").order("start_date", { ascending: true }),
        sb.from("fin_opening_balances").select("*")
      ]);
      realEntries = take("fin_entries", e);
      payments = {};
      take("fin_payments", p).forEach((x) => { (payments[x.entry_id] = payments[x.entry_id] || []).push(x); });
      movements = take("fin_movements", m);
      ledger = take("fin_ledger", l);
      recurrences = take("fin_recurrences", r);
      openings = {};
      take("fin_opening_balances", o).forEach((x) => { openings[x.month] = toCents(x.amount); });
    } catch (err) {
      failed.push("conexão: " + err.message);
    }
    setStatus(failed.length
      ? "Algumas tabelas não carregaram (" + failed.join(" | ") + ")"
      : "Sincronizado");
    try {
      render();
    } catch (err) {
      setStatus("Erro ao exibir: " + err.message);
      console.error(err);
    }
  }

  // Ocorrências de recorrência do mês, ainda não gravadas. Só viram lançamento ao serem usadas.
  function virtualFor(ym) {
    const [y, mo] = ym.split("-").map(Number);
    const last = new Date(y, mo, 0).getDate();
    const first = ym + "-01";
    const lastStr = ym + "-" + String(last).padStart(2, "0");
    const out = [];
    recurrences.forEach((r) => {
      if (!r.active) return;
      if (r.start_date > lastStr) return;
      if (r.end_date && r.end_date < first) return;
      const due = ym + "-" + String(Math.min(r.day_of_month, last)).padStart(2, "0");
      if (due < r.start_date) return;
      if (r.end_date && due > r.end_date) return;
      if (realEntries.some((en) => en.recurrence_id === r.id && en.due_date === due)) return;
      out.push({
        id: "v:" + r.id + ":" + due, virtual: true, recurrence_id: r.id,
        kind: r.kind, description: r.description, counterparty: r.counterparty,
        category: r.category, amount: r.amount, due_date: due, notes: null,
        status: "ativo", installment_group: null
      });
    });
    return out;
  }

  // Grava a ocorrência virtual como lançamento real e devolve o id (null em caso de erro).
  async function materialize(en) {
    if (!en.virtual) return en.id;
    const { data: u } = await sb.auth.getUser();
    const { data, error } = await sb.from("fin_entries").insert({
      user_id: u.user.id, kind: en.kind, description: en.description,
      counterparty: en.counterparty, category: en.category, notes: en.notes,
      amount: toCents(en.amount) / 100, due_date: en.due_date,
      recurrence_id: en.recurrence_id
    }).select("id").single();
    if (error) {
      setStatus("Não foi possível salvar: " + error.message);
      return null;
    }
    return data.id;
  }

  // ---------- telas ----------
  function render() {
    entries = realEntries.concat(virtualFor(month));
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    $("v-contas").hidden = view !== "contas";
    $("v-caixa").hidden = view !== "caixa";
    $("v-mov").hidden = view !== "mov";
    $("v-mensal").hidden = view !== "mensal";
    $("v-fluxo").hidden = view !== "fluxo";
    $("month").value = month;
    if (view === "contas") { renderContas(); renderRecs(); }
    if (view === "caixa") renderCaixa();
    if (view === "mov") renderMov();
    if (view === "mensal") renderMensal();
    if (view === "fluxo") renderFluxo();
  }

  // Contas a pagar e receber
  function renderContas() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
    const inMonth = entries.filter((en) => en.due_date.slice(0, 7) === month);
    let payOpen = 0, recOpen = 0, payDone = 0;
    inMonth.forEach((en) => {
      if (en.status === "cancelado") return;
      const s = summarize(en);
      if (en.kind === "pagar") payOpen += s.balance; else recOpen += s.balance;
    });
    entries.forEach((en) => {
      if (en.kind !== "pagar") return;
      (payments[en.id] || []).forEach((x) => {
        if (x.paid_on.slice(0, 7) === month) payDone += toCents(x.amount);
      });
    });
    $("k-pay-open").textContent = brl(payOpen);
    $("k-pay-done").textContent = brl(payDone);
    $("k-rec-open").textContent = brl(recOpen);
    const result = recOpen - payOpen;
    $("k-result").textContent = brl(result);
    $("k-result").style.color = result < 0 ? "var(--neg)" : "var(--pos)";

    const list = inMonth
      .filter((en) => en.kind === tab)
      .sort((a, b) => a.due_date.localeCompare(b.due_date));
    const box = $("list");
    box.textContent = "";
    if (!list.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = tab === "pagar" ? "Nenhuma conta a pagar neste mês." : "Nenhuma conta a receber neste mês.";
      box.append(p);
      return;
    }
    list.forEach((en) => box.append(entryEl(en)));
  }

  function entryEl(en) {
    const s = summarize(en);
    const parts = {
      title: en.description,
      meta: [en.counterparty, en.category, "vence " + fmtDate(en.due_date), en.installment_group ? "parcela" : null]
        .filter(Boolean).join(" · "),
      badge: LABEL[s.st],
      badgeClass: s.st,
      amount: brl(s.total),
      amountClass: "",
      actions: []
    };
    if (s.st !== "quitado" && s.st !== "cancelado") parts.meta += " · saldo " + brl(s.balance);
    if (s.st !== "cancelado" && s.balance > 0) {
      parts.actions.push(btn(
        tab === "pagar" ? "Registrar pagamento" : "Registrar recebimento",
        () => { payOpenId = payOpenId === en.id ? null : en.id; render(); },
        "primary"
      ));
    }
    parts.actions.push(btn("Editar", () => startEdit(en)));
    if (s.st !== "cancelado") parts.actions.push(armedBtn("Cancelar lançamento", () => cancelEntry(en)));
    if (!en.virtual) parts.actions.push(armedBtn("Excluir lançamento", () => deleteEntry(en)));
    const row = item(parts);

    if (payOpenId === en.id) row.append(payForm(en, s));

    const hist = payments[en.id] || [];
    if (hist.length) {
      const h = document.createElement("div");
      h.className = "hist";
      hist.forEach((x) => {
        const line = document.createElement("div");
        const txt = document.createElement("span");
        txt.textContent = fmtDate(x.paid_on) + " · " + brl(toCents(x.amount));
        line.append(txt, armedBtn("Excluir", () => deletePayment(x)));
        h.append(line);
      });
      row.append(h);
    }
    return row;
  }

  function payForm(en, s) {
    const f = document.createElement("div");
    f.className = "inline-form";
    const amt = document.createElement("input");
    amt.type = "text";
    amt.inputMode = "decimal";
    amt.value = (s.balance / 100).toFixed(2).replace(".", ",");
    amt.setAttribute("aria-label", "Valor do pagamento");
    const dt = document.createElement("input");
    dt.type = "date";
    dt.value = todayStr();
    dt.setAttribute("aria-label", "Data do pagamento");
    const ok = btn("Confirmar", () => registerPayment(en, s, amt.value, dt.value), "primary");
    f.append(amt, dt, ok);
    return f;
  }

  // Caixa: lançamentos diretos de entrada e saída
  function renderCaixa() {
    const list = movements
      .filter((m) => m.data.slice(0, 7) === month)
      .sort((a, b) => a.data.localeCompare(b.data));
    let inn = 0, out = 0;
    list.forEach((m) => { if (m.tipo === "entrada") inn += toCents(m.amount); else out += toCents(m.amount); });
    $("cx-totals").textContent = "";
    $("cx-totals").append(totalBox("Entradas", inn), totalBox("Saídas", out), totalBox("Saldo do mês", inn - out));

    const box = $("cx-list");
    box.textContent = "";
    if (!list.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nenhum lançamento de caixa neste mês.";
      box.append(p);
      return;
    }
    list.forEach((m) => box.append(movementEl(m, true)));
  }

  function totalBox(label, cents) {
    const w = document.createElement("div");
    const s = document.createElement("span");
    s.textContent = label;
    const v = document.createElement("strong");
    v.textContent = brl(cents);
    v.style.color = cents < 0 ? "var(--neg)" : "var(--ink)";
    w.append(s, v);
    return w;
  }

  function movementEl(m, editable) {
    const isIn = m.tipo === "entrada";
    const actions = [];
    if (editable) {
      actions.push(btn("Editar", () => startCaixaEdit(m)));
      actions.push(armedBtn("Excluir", () => deleteMovement(m)));
    }
    return item({
      title: m.description,
      meta: [m.counterparty, m.category, fmtDate(m.data), m.notes].filter(Boolean).join(" · "),
      badge: editable ? "Caixa" : "Baixa",
      badgeClass: editable ? "caixa" : "baixa",
      amount: (isIn ? "+ " : "− ") + brl(toCents(m.amount)),
      amountClass: isIn ? "amount-in" : "amount-out",
      actions: actions
    });
  }

  // Movimentações: tudo que entrou e saiu, do caixa e das contas baixadas
  function renderMov() {
    document.querySelectorAll("[data-mov]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mov === movTipo)));
    document.querySelectorAll("[data-origem]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.origem === movOrigem)));

    const all = ledger.filter((x) => x.data.slice(0, 7) === month);
    let inn = 0, out = 0;
    all.forEach((x) => { if (x.tipo === "entrada") inn += toCents(x.amount); else out += toCents(x.amount); });
    $("mov-totals").textContent = "";
    $("mov-totals").append(totalBox("Entradas", inn), totalBox("Saídas", out), totalBox("Saldo do mês", inn - out));

    const list = all
      .filter((x) => movTipo === "todas" || x.tipo === movTipo)
      .filter((x) => movOrigem === "todas" || x.origem === movOrigem)
      .sort((a, b) => a.data.localeCompare(b.data));
    const box = $("mov-list");
    box.textContent = "";
    if (!list.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nenhuma movimentação neste filtro.";
      box.append(p);
      return;
    }
    list.forEach((x) => {
      if (x.origem === "caixa") {
        const m = movements.find((mv) => mv.id === x.id);
        if (m) { box.append(movementEl(m, true)); return; }
      }
      box.append(movementEl({
        tipo: x.tipo, description: x.description, counterparty: x.counterparty,
        category: x.category, data: x.data, amount: x.amount, notes: "conta baixada"
      }, false));
    });
  }

  // ---------- planilha do mês (formato da aba Junho) ----------
  // Cada conta a pagar ou receber do mês vira uma linha. O grupo é o campo categoria.
  const GROUP_ORDER = ["Moradia", "Educação", "Cartões", "Empréstimos", "Encargos e Seguros", "Carro", "Outros"];

  function monthList(kind) {
    return entries
      .filter((en) => en.kind === kind && en.due_date.slice(0, 7) === month && en.status !== "cancelado")
      .sort((a, b) => a.due_date.localeCompare(b.due_date) || a.description.localeCompare(b.description));
  }
  function sumCents(list, f) { return list.reduce((s, en) => s + f(en), 0); }
  function moneyText(c) { return (c / 100).toFixed(2).replace(".", ","); }
  function dayOf(en) { return Number(en.due_date.slice(8, 10)); }

  function cellInput(value, opts, onCommit) {
    const inp = document.createElement("input");
    inp.type = opts.type || "text";
    if (opts.inputMode) inp.inputMode = opts.inputMode;
    if (opts.min) inp.min = opts.min;
    if (opts.max) inp.max = opts.max;
    if (opts.width) inp.style.width = opts.width;
    inp.value = value;
    inp.setAttribute("aria-label", opts.label);
    inp.addEventListener("change", () => onCommit(inp.value));
    return inp;
  }
  function cell(content, cls) {
    const c = document.createElement("td");
    if (cls) c.className = cls;
    if (typeof content === "string") c.textContent = content; else c.append(content);
    return c;
  }
  function sheetTable(heads) {
    const t = document.createElement("table");
    t.className = "sheet";
    const thead = document.createElement("thead");
    const tr = document.createElement("tr");
    heads.forEach((h, i) => {
      const th = document.createElement("th");
      th.textContent = h;
      if (i > 0) th.className = "num";
      tr.append(th);
    });
    thead.append(tr);
    const tbody = document.createElement("tbody");
    t.append(thead, tbody);
    return { t, tbody };
  }
  function sheetRow(en) {
    const s = summarize(en);
    const tr = document.createElement("tr");
    tr.append(
      cell(cellInput(en.description, { label: "Descrição" },
        (v) => updateEntry(en, { description: v.trim() || en.description }))),
      cell(cellInput(String(dayOf(en)), { type: "number", min: 1, max: 31, width: "56px", label: "Dia" },
        (v) => setDay(en, v)), "num"),
      cell(cellInput(moneyText(s.total), { inputMode: "decimal", width: "110px", label: "Previsto" },
        (v) => setPrevisto(en, v)), "num"),
      cell(cellInput(moneyText(s.paid), { inputMode: "decimal", width: "110px", label: "Realizado" },
        (v) => setRealizado(en, v)), "num"),

  async function updateEntry(en, patch) {
    const id = await materialize(en);
    if (!id) return;
    const { error } = await sb.from("fin_entries")
      .update(Object.assign({ updated_at: new Date().toISOString() }, patch))
      .eq("id", id);
    await load();
    setStatus(error ? "Não foi possível salvar: " + error.message : "Alteração salva");
  }
  function setDay(en, v) {
    const dia = Math.floor(Number(v));
    if (!(dia >= 1 && dia <= 31)) { setStatus("Dia entre 1 e 31"); load(); return; }
    const [y, m] = month.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    updateEntry(en, { due_date: month + "-" + String(Math.min(dia, last)).padStart(2, "0") });
  }
  function setPrevisto(en, v) {
    const c = toCents(v);
    if (!(c > 0)) { setStatus("Valor inválido"); load(); return; }
    updateEntry(en, { amount: (c / 100).toFixed(2) });
  }
  // Realizado aumenta com uma baixa pela diferença. Para reduzir, exclua a baixa na tela Contas.
  async function setRealizado(en, v) {
    const c = toCents(v);
    if (!(c >= 0)) { setStatus("Valor inválido"); load(); return; }
    const paid = summarize(en).paid;
    if (c === paid) return;
    if (c < paid) { setStatus("Para reduzir o realizado, exclua a baixa na tela Contas"); load(); return; }
    const id = await materialize(en);
    if (!id) return;
    const { error } = await sb.from("fin_payments").insert({
      entry_id: id, amount: ((c - paid) / 100).toFixed(2), paid_on: todayStr()
    });
    await load();
    setStatus(error ? "Não foi possível registrar: " + error.message : "Baixa registrada pelo realizado");
  }
  async function addEntry(kind, group, description, dia, valor) {
    description = description.trim();
    const c = toCents(valor);
    const d = Math.floor(Number(dia));
    if (!description) { setStatus("Informe a descrição"); return; }
    if (!(c > 0)) { setStatus("Informe o valor previsto"); return; }
    if (!(d >= 1 && d <= 31)) { setStatus("Informe o dia (1 a 31)"); return; }
    const [y, m] = month.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    const { data: u } = await sb.auth.getUser();
    const { error } = await sb.from("fin_entries").insert({
      user_id: u.user.id, kind: kind, description: description, category: group || null,
      amount: (c / 100).toFixed(2), due_date: month + "-" + String(Math.min(d, last)).padStart(2, "0")
    });
    await load();
    setStatus(error ? "Não foi possível adicionar: " + error.message : "Item adicionado");
  }

  function renderMensal() {
    const rec = monthList("receber"), pag = monthList("pagar");
    const prev = (l) => sumCents(l, (en) => toCents(en.amount));
    const real = (l) => sumCents(l, (en) => summarize(en).paid);
    const box = $("sheet");
    box.textContent = "";

    // Resumo: receitas, despesas, resultado e divisão por dia 14/15, como na aba Junho
    const near = pag.filter((en) => dayOf(en) < 15);
    const far = pag.filter((en) => dayOf(en) >= 15);
    const res = sheetTable(["Resumo", "Previsto", "Realizado"]);
    const sumRow = (label, p, r, cls) => {
      const tr = document.createElement("tr");
      tr.className = cls || "";
      tr.append(cell(label), cell(brl(p), "num"), cell(brl(r), "num"));
      res.tbody.append(tr);
    };
    sumRow("Receitas", prev(rec), real(rec));
    sumRow("Despesas", prev(pag), real(pag));
    sumRow("Resultado", prev(rec) - prev(pag), real(rec) - real(pag), "bold");
    sumRow("Despesas até o dia 14", prev(near), real(near));
    sumRow("Despesas a partir do dia 15", prev(far), real(far));
    box.append(res.t);

    // Receitas
    const rt = sheetTable(["Receitas", "Dia", "Previsto", "Realizado", "Saldo", ""]);
    rec.forEach((en) => rt.tbody.append(sheetRow(en)));
    rt.tbody.append(subRow("Total de receitas", prev(rec), real(rec)));
    rt.tbody.append(addRow("receber", "Receitas"));
    box.append(rt.t);

    // Despesas, por grupo (grupos conhecidos sempre aparecem, mesmo vazios)
    const present = [...new Set(pag.map((en) => en.category || "Sem grupo"))];
    const groups = GROUP_ORDER.concat(present.filter((g) => !GROUP_ORDER.includes(g)));
    groups.forEach((g) => {
      const isEmpty = !present.includes(g);
      if (isEmpty && GROUP_ORDER.indexOf(g) < 0) return;
      const list = pag.filter((en) => (en.category || "Sem grupo") === g);
      const gt = sheetTable([g, "Dia", "Previsto", "Realizado", "Saldo", ""]);
      list.forEach((en) => gt.tbody.append(sheetRow(en)));
      gt.tbody.append(subRow("Subtotal " + g, prev(list), real(list)));
      gt.tbody.append(addRow("pagar", g === "Sem grupo" ? null : g));
      box.append(gt.t);
    });
  }

  // ---------- fluxo de caixa: previsto x realizado por dia ----------
  // Previsto = contas pelo vencimento (valor total). Realizado = caixa e baixas pela data do movimento.
  function moneyOrDash(c) { return c ? brl(c) : "—"; }
  function sumVals(o) { return Object.values(o).reduce((s, v) => s + v, 0); }

  async function saveOpening(v) {
    const c = toCents(v);
    if (!Number.isFinite(c)) { setStatus("Valor inválido"); render(); return; }
    const { data: u } = await sb.auth.getUser();
    const { error } = await sb.from("fin_opening_balances").upsert(
      { user_id: u.user.id, month: month, amount: (c / 100).toFixed(2) },
      { onConflict: "user_id,month" }
    );
    await load();
    setStatus(error ? "Não foi possível salvar: " + error.message : "Saldo inicial salvo");
  }

  function renderFluxo() {
    const [y, m] = month.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    const pIn = {}, pOut = {}, rIn = {}, rOut = {};
    const add = (obj, d, c) => { obj[d] = (obj[d] || 0) + c; };
    entries.forEach((en) => {
      if (en.status === "cancelado" || en.due_date.slice(0, 7) !== month) return;
      const d = dayOf(en), c = toCents(en.amount);
      if (en.kind === "receber") add(pIn, d, c); else add(pOut, d, c);
    });
    ledger.forEach((x) => {
      if (x.data.slice(0, 7) !== month) return;
      const d = Number(x.data.slice(8, 10)), c = toCents(x.amount);
      if (x.tipo === "entrada") add(rIn, d, c); else add(rOut, d, c);
    });

    const open = openings[month] || 0;
    let accP = open, accR = open;
    const box = $("fx-sheet");
    box.textContent = "";
    const t = sheetTable(["Dia", "Previsto entradas", "Previsto saídas", "Realizado entradas", "Realizado saídas", "Saldo previsto", "Saldo realizado", "Diferença"]);
    for (let d = 1; d <= last; d++) {
      accP += (pIn[d] || 0) - (pOut[d] || 0);
      accR += (rIn[d] || 0) - (rOut[d] || 0);
      const tr = document.createElement("tr");
      if (!pIn[d] && !pOut[d] && !rIn[d] && !rOut[d]) tr.className = "muted-row";
      tr.append(
        cell(String(d).padStart(2, "0") + "/" + month.slice(5, 7)),
        cell(moneyOrDash(pIn[d]), "num"),
        cell(moneyOrDash(pOut[d]), "num"),
        cell(moneyOrDash(rIn[d]), "num"),
        cell(moneyOrDash(rOut[d]), "num"),
        cell(brl(accP), "num" + (accP < 0 ? " neg" : "")),
        cell(brl(accR), "num" + (accR < 0 ? " neg" : "")),
        cell(brl(accR - accP), "num" + (accR - accP < 0 ? " neg" : ""))
      );
      t.tbody.append(tr);
    }
    const tot = document.createElement("tr");
    tot.className = "sub";
    tot.append(
      cell("Total"),
      cell(brl(sumVals(pIn)), "num"), cell(brl(sumVals(pOut)), "num"),
      cell(brl(sumVals(rIn)), "num"), cell(brl(sumVals(rOut)), "num"),
      cell(brl(accP), "num"), cell(brl(accR), "num"), cell(brl(accR - accP), "num")
    );
    t.tbody.append(tot);
    box.append(t.t);

    $("fx-open").value = moneyText(open);
    const totals = $("fx-totals");
    totals.textContent = "";
    totals.append(
      totalBox("Saldo inicial", open),
      totalBox("Entradas previstas", sumVals(pIn)),
      totalBox("Saídas previstas", sumVals(pOut)),
      totalBox("Saldo previsto no fim", accP),
      totalBox("Saldo realizado no fim", accR)
    );
  }
  $("fx-open").addEventListener("change", () => saveOpening($("fx-open").value));

  // ---------- categorias (lista salva no banco; "+ Nova categoria" cria uma) ----------
  const DEFAULT_FIN_CATS = [
    "Moradia", "Educação", "Cartões", "Empréstimos", "Encargos e Seguros", "Carro", "Outros",
    "Alimentação", "Saúde", "Lazer", "Assinaturas", "Impostos",
    "Receitas", "Salário", "Benefícios", "Renda extra", "Prestação de serviços"
  ];
  async function loadCats() {
    const { data, error } = await sb.from("fin_categories").select("name").order("name", { ascending: true });
    if (error) return;
    if (!data.length) {
      const { data: u } = await sb.auth.getUser();
      const { error: insErr } = await sb.from("fin_categories")
        .insert(DEFAULT_FIN_CATS.map((name) => ({ user_id: u.user.id, name: name })));
      if (insErr) return;
      return loadCats();
    }
    categories = data.map((x) => x.name);
    fillCatSelect("f-cat");
    fillCatSelect("cx-cat");
  }
  function fillCatSelect(id) {
    const sel = $(id);
    const cur = sel.value;
    sel.textContent = "";
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "Sem categoria";
    sel.append(none);
    categories.forEach((n) => {
      const o = document.createElement("option");
      o.value = n;
      o.textContent = n;
      sel.append(o);
    });
    const nw = document.createElement("option");
    nw.value = "__new__";
    nw.textContent = "+ Nova categoria…";
    sel.append(nw);
    sel.value = cur;
  }
  // Valor escolhido no seletor, ou o nome digitado quando for "Nova categoria"
  function catValue(selId, newId) {
    const v = $(selId).value;
    if (v === "__new__") return $(newId).value.trim() || null;
    return v || null;
  }
  async function ensureCat(name) {
    if (!name || categories.includes(name)) return;
    const { data: u } = await sb.auth.getUser();
    await sb.from("fin_categories").insert({ user_id: u.user.id, name: name });
    categories.push(name);
    categories.sort((a, b) => a.localeCompare(b));
  }
  // Mostra no seletor a categoria de um lançamento, mesmo que ela não esteja na lista
  function pickCat(selId, newId, value) {
    if (value && !categories.includes(value)) categories.push(value);
    fillCatSelect(selId);
    $(selId).value = value || "";
    $(newId).hidden = true;
  }
  $("f-cat").addEventListener("change", () => { $("f-cat-new").hidden = $("f-cat").value !== "__new__"; });
  $("cx-cat").addEventListener("change", () => { $("cx-cat-new").hidden = $("cx-cat").value !== "__new__"; });

  // ---------- ações: contas ----------
  async function registerPayment(en, s, value, paidOn) {
    const c = toCents(value);
    if (!(c > 0)) { setStatus("Informe um valor maior que zero"); return; }
    if (c > s.balance) { setStatus("O valor é maior que o saldo em aberto"); return; }

    const id = await materialize(en);
    if (!id) return;
    const { error } = await sb.from("fin_payments").insert({
      entry_id: id, amount: (c / 100).toFixed(2), paid_on: paidOn
    });
    if (error) { setStatus("Não foi possível registrar: " + error.message); return; }
    payOpenId = null;
    await load();
    setStatus("Baixa registrada");

  // Encerra a partir do mês exibido: ocorrências anteriores continuam, as seguintes somem.
  async function endRecurrence(r) {
    const [y, m] = month.split("-").map(Number);
    const cut = new Date(y, m - 1, 0).toLocaleDateString("en-CA");
    const { error } = r.start_date > cut
      ? await sb.from("fin_recurrences").update({ active: false }).eq("id", r.id)
      : await sb.from("fin_recurrences").update({ end_date: cut }).eq("id", r.id);
    if (error) { setStatus("Não foi possível encerrar: " + error.message); return; }
    await load();
    setStatus("Recorrência encerrada a partir de " + fmtDate(month + "-01"));
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const c = toCents($("f-amount").value);
    if (!(c > 0)) { setStatus("Informe um valor maior que zero"); return; }
    const kind = $("f-kind").value;
    const description = $("f-desc").value.trim();
    const counterparty = $("f-who").value.trim() || null;
    const category = catValue("f-cat", "f-cat-new");
    await ensureCat(category);
    const due = $("f-due").value;
    const notes = $("f-notes").value.trim() || null;
    const mensal = !editId && $("f-rec").value === "monthly";
    const n = mensal ? 1 : Math.floor(Number($("f-n").value));
    if (!description || !due) { setStatus("Preencha descrição e vencimento"); return; }

    let res;
    if (editId) {
      const id = await materialize(editEn);
      if (!id) return;
      res = await sb.from("fin_entries").update({
        kind, description, counterparty, category, notes, due_date: due,
        amount: (c / 100).toFixed(2), updated_at: new Date().toISOString()
      }).eq("id", id);
    } else if (mensal) {
      // Regra mensal: não cria lançamentos agora; cada mês aparece como ocorrência virtual
      const endD = $("f-rec-end").value || null;
      if (endD && endD < due) { setStatus("A data final deve ser depois do vencimento"); return; }
      const { data: u } = await sb.auth.getUser();
      res = await sb.from("fin_recurrences").insert({
        user_id: u.user.id, kind, description, counterparty, category,
        amount: (c / 100).toFixed(2), day_of_month: Number(due.slice(8, 10)),
        start_date: due, end_date: endD, active: true
      });
    } else if (n > 1) {
      // Desdobra em n parcelas mensais, a partir do vencimento informado
      if (n > 360) { setStatus("No máximo 360 parcelas"); return; }
      res = await sb.rpc("fin_installments", {
        p_kind: kind, p_description: description, p_counterparty: counterparty,
        p_category: category, p_total: (c / 100).toFixed(2), p_n: n,
        p_first_due: due, p_notes: notes
      });
    } else {
      const { data: u } = await sb.auth.getUser();
      res = await sb.from("fin_entries").insert({
        user_id: u.user.id, kind, description, counterparty, category, notes,
        amount: (c / 100).toFixed(2), due_date: due
      });
    }
    if (res.error) { setStatus("Não foi possível salvar: " + res.error.message); return; }
    month = due.slice(0, 7);
    tab = kind;
    closeForm();
    await load();
    setStatus(mensal ? "Repetição mensal criada"
      : n > 1 && !editId ? n + " parcelas criadas" : "Lançamento salvo");
  });

    if (res.error) { setStatus("Não foi possível salvar: " + res.error.message); return; }
    month = data.slice(0, 7);
    resetCaixaForm();
    await load();
    setStatus("Lançamento de caixa salvo");
  });
  $("cx-cancel").addEventListener("click", () => { resetCaixaForm(); render(); });

  // ---------- movimentações: filtros ----------
  document.querySelectorAll("[data-mov]").forEach((b) => {
    b.addEventListener("click", () => { movTipo = b.dataset.mov; render(); });
  });
  document.querySelectorAll("[data-origem]").forEach((b) => {
    b.addEventListener("click", () => { movOrigem = b.dataset.origem; render(); });
  });

  // ---------- navegação e mês ----------
  document.querySelectorAll("[data-view]").forEach((b) => {
    b.addEventListener("click", () => { view = b.dataset.view; render(); });
  });
  $("month").addEventListener("change", () => {
    month = $("month").value || todayStr().slice(0, 7);
    payOpenId = null;
    render();
  });

  // ---------- login (mesmo fluxo do Planner) ----------
  const emailEl = $("email"), codeEl = $("code"), authMsg = $("auth-msg");
  emailEl.value = localStorage.getItem("planner-email") || "";

  $("send").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    if (!email) { authMsg.textContent = "Digite seu e-mail."; return; }
    authMsg.textContent = "Enviando código…";
    const { error } = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
    if (error) { authMsg.textContent = "Não foi possível enviar: " + error.message; return; }
    localStorage.setItem("planner-email", email);
    codeEl.hidden = false;
    $("verify").hidden = false;
    authMsg.textContent = "Confira seu e-mail e digite o código.";
    codeEl.focus();
  });
  $("verify").addEventListener("click", async () => {
    const token = codeEl.value.trim();
    if (!token) { authMsg.textContent = "Digite o código."; return; }
    const { error } = await sb.auth.verifyOtp({ email: emailEl.value.trim(), token: token, type: "email" });
    if (error) authMsg.textContent = "Código inválido ou expirado.";
  });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); });

  function showApp(on) {
    $("auth").hidden = on;
    $("app").hidden = !on;
  }
  resetCaixaForm();
  sb.auth.onAuthStateChange((event, session) => {
    if (session) { showApp(true); load(); } else { showApp(false); }
  });
  sb.auth.getSession().then(({ data }) => { if (!data.session) showApp(false); });
})();
</script>
<script>
(function () {
  var b = document.getElementById("menu-toggle");
  if (!b) return;
  function set(hide) {
    document.body.classList.toggle("menu-hidden", hide);
    b.setAttribute("aria-expanded", String(!hide));
    b.textContent = hide ? "☰ Mostrar menu" : "☰ Esconder menu";
    try { localStorage.setItem("menu-hidden", hide ? "1" : "0"); } catch (e) {}
  }
  var saved = false;
  try { saved = localStorage.getItem("menu-hidden") === "1"; } catch (e) {}
  set(saved);
  b.addEventListener("click", function () { set(!document.body.classList.contains("menu-hidden")); });
})();
</script>
<script>
(function () {
  var m = document.querySelector(".panel-menu");
  if (!m) return;
  var b = m.querySelector(".curtain-btn");
  if (!b) return;
  function set(open) {
    m.classList.toggle("open", open);
    b.setAttribute("aria-expanded", String(open));
    b.textContent = open ? "✕ Fechar" : "☰ Menu";
  }
  b.addEventListener("click", function () { set(!m.classList.contains("open")); });
  m.addEventListener("click", function (e) {
    if (e.target !== b && e.target.closest("button, a")) set(false);
  });
})();
</script>
